<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt practice, decimal answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="Main.dc.html" aria-label="Stop and go home" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1B2559"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<div role="img" aria-label="Review, question 2 of 4" style="flex-grow: 1; display: flex; gap: 6px">
<div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #2F5BEA"></div>
<div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #FFC533"></div>
<div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #DCE4FA"></div>
<div style="flex-grow: 1; height: 12px; border-radius: 999px; background: #DCE4FA"></div>
</div>
<span style="font-weight: 800; font-size: 15px">4 XP</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #4A5480">Mending: adding decimals</span>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.2">Add. Line up the points.</h1>
</div>
<div style="flex-grow: 1; background: #FFFFFF; border-radius: 24px; display: flex; align-items: center; justify-content: center">
<div role="img" aria-label="3.50 plus 1.25, written one above the other with the decimal points lined up. Your answer so far: 4.7" style="display: grid; grid-template-columns: 44px 40px 16px 40px 40px; row-gap: 4px; justify-items: center; align-items: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 60px; line-height: 1.1">
<span></span><span>3</span><span>.</span><span>5</span><span style="color: #DCE4FA">0</span>
<span style="color: #2F5BEA">+</span><span>1</span><span>.</span><span>2</span><span>5</span>
<div style="grid-column: 1 / -1; justify-self: stretch; height: 5px; border-radius: 999px; background: #1B2559; margin: 4px 0 8px"></div>
<div style="grid-column: 1 / -1; justify-self: stretch; display: grid; grid-template-columns: 44px 40px 16px 40px 40px; justify-items: center; align-items: center; border-radius: 16px; background: #FFF3CC; box-shadow: inset 0 0 0 3px #FFC533; padding: 2px 0">
<span></span><span>4</span><span>.</span><span>7</span><span style="width: 4px; height: 50px; border-radius: 2px; background: #1B2559"></span>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" aria-label="{{k.name}}" style="height: 60px; border: 0; border-radius: 18px; background: #FFFFFF; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; box-shadow: 0 4px 0 #DCE4FA; cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
<button type="button" style="height: 64px; border: 0; border-radius: 22px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; box-shadow: 0 5px 0 #1D3FB3; cursor: pointer; margin-bottom: 5px">Check</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'Del'];
return { keys: labels.map((l) => ({ label: l, name: l === 'Del' ? 'Delete last digit' : (l === '.' ? 'Decimal point' : l) })) };
}
}
</script>
</body>
</html>
