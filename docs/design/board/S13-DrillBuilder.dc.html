<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column">

<button type="button" aria-pressed="true" style="height: 76px; border: 0; border-radius: 18px; background: #FFFFFF; color: #1B2559; box-shadow: inset 0 0 0 3px #2F5BEA; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">7 + ? = 12</span>Missing</button>
</div>

<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 13px; background: transparent; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">10</button>
<button type="button" aria-pressed="true" style="height: 44px; border: 0; border-radius: 13px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">20</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 13px; background: transparent; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">30</button>
<button type="button" aria-pressed="false" style="height: 44px; border: 0; border-radius: 13px; background: transparent; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">50</button>
