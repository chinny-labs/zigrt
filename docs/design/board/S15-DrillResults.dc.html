<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, drill results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px 28px; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #4A5480">Drill done</span>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15">17 of 20 right. Nice work!</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #4A5480">Right</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">17</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #4A5480">Time</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">2:41</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 12px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; font-weight: 800; color: #4A5480">Earned</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; line-height: 1.1">+1 XP</span>
</div>
</div>
<div style="flex-grow: 1; background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-weight: 800; font-size: 16px">Three to look at again</span>
<sc-for list="{{misses}}" as="m" hint-placeholder-count="3">
<div style="background: #FFF3CC; border-radius: 16px; padding: 0 14px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px">{{m.q}} <span style="color: #2F5BEA">{{m.a}}</span></span>
<span style="font-size: 14px; font-weight: 800; color: #4A5480; white-space: nowrap">You wrote {{m.yours}}</span>
</div>
</sc-for>
</div>
<a href="S14-Drill.dc.html" style="text-decoration: none; height: 64px; border-radius: 22px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; box-shadow: 0 5px 0 #1D3FB3; display: flex; align-items: center; justify-content: center">Drill just these three</a>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 4px">
<a href="S14-Drill.dc.html" style="text-decoration: none; height: 56px; border-radius: 20px; background: #FFFFFF; color: #1B2559; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #DCE4FA; display: flex; align-items: center; justify-content: center">Go again</a>
<a href="Main.dc.html" style="text-decoration: none; height: 56px; border-radius: 20px; background: #FFFFFF; color: #1B2559; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #DCE4FA; display: flex; align-items: center; justify-content: center">Done</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { misses: [
{ q: '7 × 8 =', a: '56', yours: '54' },
{ q: '6 × 9 =', a: '54', yours: '56' },
{ q: '8 + 7 =', a: '15', yours: '16' }
] };
}
}
</script>
</body>
</html>
