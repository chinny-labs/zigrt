<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, parent notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="P2-Dashboard.dc.html" aria-label="Back to the dashboard" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1B2559"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="flex-grow: 1; margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15">Notifications</h1>
<button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #2F5BEA; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">Mark all read</button>
</div>
<sc-for list="{{items}}" as="n" hint-placeholder-count="5">
<div style="background: {{n.bg}}; box-shadow: {{n.ring}}; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-weight: 800; font-size: 16px; line-height: 1.3">{{n.title}}</span>
<span style="flex-shrink: 0; font-size: 13px; font-weight: 800; color: #4A5480">{{n.when}}</span>
</div>
<span style="font-size: 15px; font-weight: 700; color: #4A5480; line-height: 1.4">{{n.body}}</span>
<sc-if value="{{n.action}}" hint-placeholder-val="{{false}}"><a href="{{n.href}}" style="align-self: flex-start; text-decoration: none; margin-top: 6px; height: 44px; padding: 0 16px; border-radius: 14px; background: #2F5BEA; color: #FFFFFF; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #1D3FB3; display: flex; align-items: center; margin-bottom: 4px">{{n.action}}</a></sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const fresh = { bg: '#FFFFFF', ring: 'inset 0 0 0 3px #2F5BEA' };
const seen = { bg: '#FFFFFF', ring: 'none' };
return { items: [
Object.assign({ title: 'Theo is locked out', when: '10 min ago', body: 'Ten wrong PINs in a row. He stays locked until you unlock him.', action: 'Unlock Theo', href: 'P4-StudentSettings.dc.html' }, fresh),
Object.assign({ title: 'A lesson stopped twice for Theo', when: 'Sat', body: 'Long division by 1 digit. Zigrt is mending the blocks under it first.', action: 'See Theo', href: 'P3-Student.dc.html' }, fresh),
Object.assign({ title: 'June met her goal', when: 'Today', body: '10 of 10 XP. Her streak is 5 days.', action: '', href: '' }, seen),
Object.assign({ title: 'Mika finished a tier face', when: 'Fri', body: 'Every "Place value" block in Grade 2 is placed.', action: '', href: '' }, seen),
Object.assign({ title: 'A newer content pack is in the content folder', when: 'Thu', body: 'Install it from Household settings when you are ready.', action: 'Open Household', href: 'P5-Household.dc.html' }, seen)
] };
}
}
</script>
</body>
</html>
