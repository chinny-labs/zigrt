<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, first-run setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px 28px; gap: 16px">
<div aria-label="zigrt" role="img" style="display: flex; align-items: flex-end; gap: 1px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 36px; line-height: 1; color: #2F5BEA; height: 52px">
<span style="transform: translateY(0px)">z</span><span style="transform: translateY(-4px)">i</span><span style="transform: translateY(-8px)">g</span><span style="transform: translateY(-12px)">r</span><span style="transform: translateY(-16px); color: #E09A00">t</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15">Welcome. Let's set up.</h1>
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #4A5480; line-height: 1.4">This makes the first parent account. You add students next.</p>
</div>
<form style="margin: 0; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Setup token
<input type="text" value="" placeholder="From the server log" autocomplete="off" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 3px #2F5BEA; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px">
<span style="font-size: 14px; font-weight: 700; color: #4A5480; line-height: 1.4">Zigrt printed it once when it first started. Search the log for "setup token".</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Your name
<input type="text" value="" autocomplete="name" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Email
<input type="email" value="" autocomplete="username" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Password
<input type="password" value="" autocomplete="new-password" style="height: 56px; box-sizing: border-box; padding: 0 16px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px">
<span style="font-size: 14px; font-weight: 700; color: #4A5480">At least 12 characters.</span>
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Time zone
<select style="height: 56px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px"><option>America/New_York</option></select>
<span style="font-size: 14px; font-weight: 700; color: #4A5480">Days and streaks roll over at midnight here.</span>
</label>
</form>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 60px; border: 0; border-radius: 20px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; box-shadow: 0 5px 0 #1D3FB3; cursor: pointer; margin-bottom: 5px">Create my account</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
