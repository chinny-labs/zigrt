<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, my tower, dark theme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#F1F4FF}a:hover{color:#6C8CFF}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; background: #0E1433; color: #F1F4FF; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="flex-grow: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.15">My tower</h1>
<span style="font-size: 15px; font-weight: 800; color: #B9C2EE">83 blocks placed</span>
</div>
<div role="tablist" aria-label="Tier" style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button type="button" role="tab" aria-selected="false" style="width: 30%; height: 44px; border: 0; border-radius: 9px; background: #2A3470; color: #B9C2EE; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer">5</button>
<button type="button" role="tab" aria-selected="false" style="width: 44%; height: 44px; border: 0; border-radius: 9px; background: #2A3470; color: #B9C2EE; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer">Grade 4</button>
<button type="button" role="tab" aria-selected="false" style="width: 58%; height: 44px; border: 0; border-radius: 9px; background: #2A3470; color: #B9C2EE; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer">Grade 3</button>
<button type="button" role="tab" aria-selected="true" style="width: 72%; height: 48px; border: 0; border-radius: 9px; background: #FFC533; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; box-shadow: 0 0 0 3px #F1F4FF; cursor: pointer">Grade 2 · 14 of 41</button>
<button type="button" role="tab" aria-selected="false" style="width: 86%; height: 44px; border: 0; border-radius: 9px; background: #6C8CFF; color: #0B1233; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer">Grade 1 · all 38</button>
<button type="button" role="tab" aria-selected="false" style="width: 100%; height: 44px; border: 0; border-radius: 9px; background: #6C8CFF; color: #0B1233; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; cursor: pointer">Kindergarten · all 31</button>
</div>
<div style="display: flex; gap: 6px; overflow: hidden">
<button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #F1F4FF; color: #0E1433; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; white-space: nowrap; cursor: pointer">Adding</button>
<button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #1A2250; color: #F1F4FF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; white-space: nowrap; cursor: pointer">Taking away</button>
<button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: #1A2250; color: #F1F4FF; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; white-space: nowrap; cursor: pointer">Place value</button>
</div>
<div style="background: #1A2250; border-radius: 24px; padding: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="12">
<button type="button" style="height: 64px; padding: 4px 6px; border: 0; border-radius: 12px; background: {{b.bg}}; color: {{b.ink}}; box-shadow: {{b.ring}}; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.2; cursor: pointer">{{b.name}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; font-weight: 800; color: #B9C2EE">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #6C8CFF"></span>Placed</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #6C8CFF; box-shadow: 0 0 0 2px #0E1433, 0 0 0 4px #FFC533"></span>Needs mending</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #FFC533"></span>Building</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #1A2250; box-shadow: inset 0 0 0 2px #6C8CFF"></span>Ready</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 4px; background: #2A3470; box-shadow: inset 0 0 0 1.5px #B9C2EE"></span>Later</span>
</div>
<div style="background: #1A2250; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: inset 0 0 0 3px #F1F4FF">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">Sums to 20</span>
<span style="font-size: 14px; font-weight: 800; color: #FFC533">Needs mending</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; font-size: 14px; font-weight: 700; color: #B9C2EE">
<span>Placed 3 weeks ago</span><span>Mended 2 times</span>
</div>
<a href="D-Practice.dc.html" style="text-decoration: none; height: 52px; border-radius: 18px; background: #6C8CFF; color: #0B1233; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; box-shadow: 0 4px 0 #3F5FD6; display: flex; align-items: center; justify-content: center; margin-bottom: 4px">Mend it now · 4 XP</a>
</div>
</div>
<nav aria-label="Main" style="height: 68px; background: #1A2250; display: flex; align-items: center; justify-content: space-around; border-top: 2px solid #2A3470; font-weight: 800; font-size: 13px; margin-top: 16px">
<a href="S03-HomeDark.dc.html" style="text-decoration: none; color: #B9C2EE; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; padding: 8px 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>Home</a>
<a href="D-Tower.dc.html" style="text-decoration: none; color: #B9C2EE; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; padding: 8px 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5zM9 9h6M9 13h6"/></svg>Drills</a>
<a href="D-Tower.dc.html" style="text-decoration: none; color: #6C8CFF; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 72px; padding: 8px 0"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 20v-5h4v-5h6v5h4v5M10 10V5h4v5"/></svg>Tower</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
const looks = {
placed: { bg: '#6C8CFF', ink: '#0B1233', ring: 'none' },
mend: { bg: '#6C8CFF', ink: '#0B1233', ring: '0 0 0 2px #1A2250, 0 0 0 5px #FFC533' },
building: { bg: '#FFC533', ink: '#1B2559', ring: 'none' },
ready: { bg: '#1A2250', ink: '#F1F4FF', ring: 'inset 0 0 0 3px #6C8CFF' },
later: { bg: '#2A3470', ink: '#B9C2EE', ring: 'none' }
};
const data = [
['Sums to 10', 'placed'], ['Doubles', 'placed'], ['Sums to 20', 'mend'],
['Add tens', 'placed'], ['2-digit + 1-digit', 'placed'], ['Add with regrouping', 'building'],
['2-digit + 2-digit', 'ready'], ['Add three numbers', 'ready'], ['Missing numbers', 'later'],
['Word problems', 'later'], ['Add hundreds', 'later'], ['3-digit + 2-digit', 'later']
];
return { blocks: data.map((d) => Object.assign({ name: d[0] }, looks[d[1]])) };
}
}
</script>
</body>
</html>
