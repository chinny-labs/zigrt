<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, student settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="P3-Student.dc.html" aria-label="Back to Theo" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1B2559"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15">Theo's settings</h1>
</div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Profile</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Name
<input type="text" value="Theo" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 14px; background: #F2F6FF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px">
</label>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 15px">PIN</span><span style="font-size: 14px; font-weight: 700; color: #4A5480">Set 3 months ago</span></div>
<button type="button" style="height: 48px; padding: 0 16px; border: 0; border-radius: 16px; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #DCE4FA; cursor: pointer">Set a new PIN</button>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Learning</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 800; font-size: 15px">Course
<select style="height: 52px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 14px; background: #F2F6FF; box-shadow: inset 0 0 0 2px #4A5480; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 17px"><option>Up to the end of Grade 4</option><option>Up to the end of Grade 5</option><option>All of K-5</option></select>
</label>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 15px">Daily goal</span><span style="font-size: 14px; font-weight: 700; color: #4A5480">About 20 minutes a day</span></div>
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Lower the daily goal" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: #F2F6FF; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; box-shadow: 0 4px 0 #DCE4FA; cursor: pointer">−</button>
<span style="min-width: 64px; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px">20 XP</span>
<button type="button" aria-label="Raise the daily goal" style="width: 48px; height: 48px; border: 0; border-radius: 16px; background: #F2F6FF; color: #1B2559; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px; box-shadow: 0 4px 0 #DCE4FA; cursor: pointer">+</button>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0 0 2px; font-weight: 800; font-size: 15px">Rest days</legend>
<span style="display: block; padding-bottom: 8px; font-size: 14px; font-weight: 700; color: #4A5480">A rest day never breaks a streak.</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<button type="button" aria-pressed="{{d.on}}" aria-label="{{d.name}}" style="height: 44px; border: 0; border-radius: 12px; background: {{d.bg}}; color: {{d.ink}}; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
</fieldset>
<label style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<span style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 15px">Count speed on number facts</span><span style="font-size: 14px; font-weight: 700; color: #4A5480">Theo never sees a timer</span></span>
<input type="checkbox" checked style="flex-shrink: 0; width: 26px; height: 26px; accent-color: #2F5BEA">
</label>
</div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 6px 16px; display: flex; flex-direction: column">
<a href="S04-DiagnosticIntro.dc.html" style="text-decoration: none; min-height: 54px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 16px; color: #1B2559; border-bottom: 2px solid #F2F6FF">Run the placement check again<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a>
<a href="S12-Tower.dc.html" style="text-decoration: none; min-height: 54px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 16px; color: #1B2559; border-bottom: 2px solid #F2F6FF">Mark a block as placed or not<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a>
<a href="S13-DrillBuilder.dc.html" style="text-decoration: none; min-height: 54px; display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 16px; color: #1B2559">Assign a drill or worksheet<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></a>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 60px; border: 0; border-radius: 20px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; box-shadow: 0 5px 0 #1D3FB3; cursor: pointer">Save changes</button>
<button type="button" style="align-self: center; min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; text-decoration: underline; cursor: pointer">Delete Theo and all his history</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
renderVals() {
const d = [['M', 'Monday', false], ['T', 'Tuesday', false], ['W', 'Wednesday', true], ['T', 'Thursday', false], ['F', 'Friday', false], ['S', 'Saturday', false], ['S', 'Sunday', false]];
return { days: d.map((x) => ({ label: x[0], name: x[1], on: String(x[2]), bg: x[2] ? '#2F5BEA' : '#F2F6FF', ink: x[2] ? '#FFFFFF' : '#1B2559' })) };
}
}
</script>
</body>
</html>
