<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, worksheet preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 20px 28px; gap: 14px">
<div style="display: flex; align-items: center; gap: 12px; height: 44px">
<a href="S13-DrillBuilder.dc.html" aria-label="Back to the drill builder" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #1B2559"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; line-height: 1.15">Your worksheet</h1>
</div>
<div role="img" aria-label="Preview of the printed page: 20 addition and multiplication problems with name and date lines" style="background: #FFFFFF; color: #000000; border-radius: 6px; box-shadow: 0 0 0 1px #4A5480; padding: 20px 20px 16px; display: flex; flex-direction: column; gap: 12px; font-family: 'Nunito', sans-serif">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 17px">Friday times tables</span>
<span style="font-size: 10px; font-weight: 700">Sheet 1 of 1</span>
</div>
<div style="display: flex; gap: 16px; font-size: 11px; font-weight: 700">
<span style="flex-grow: 2; border-bottom: 1px solid #000000; padding-bottom: 2px">Name</span>
<span style="flex-grow: 1; border-bottom: 1px solid #000000; padding-bottom: 2px">Date</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 8px; padding-top: 4px">
<sc-for list="{{problems}}" as="p" hint-placeholder-count="20">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 500; font-size: 13px; white-space: nowrap">{{p}}</span>
</sc-for>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 22px; padding: 4px 16px; display: flex; flex-direction: column">
<label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; font-size: 16px; border-bottom: 2px solid #F2F6FF">Name and date lines<input type="checkbox" checked style="width: 26px; height: 26px; accent-color: #2F5BEA"></label>
<label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; font-size: 16px; border-bottom: 2px solid #F2F6FF">Answer key on its own page<input type="checkbox" checked style="width: 26px; height: 26px; accent-color: #2F5BEA"></label>
<label style="min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 800; font-size: 16px">Large print<input type="checkbox" style="width: 26px; height: 26px; accent-color: #2F5BEA"></label>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 64px; border: 0; border-radius: 22px; background: #2F5BEA; color: #FFFFFF; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; box-shadow: 0 5px 0 #1D3FB3; cursor: pointer">Print</button>
<button type="button" style="height: 56px; border: 0; border-radius: 20px; background: #FFFFFF; color: #1B2559; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #DCE4FA; cursor: pointer; margin-bottom: 4px">New version, same settings</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
renderVals() {
return { problems: [
'7 × 8 = ___', '9 + 6 = ___', '4 × 6 = ___', '8 + 7 = ___',
'6 × 9 = ___', '5 + 9 = ___', '3 × 7 = ___', '7 + 7 = ___',
'8 × 4 = ___', '6 + 8 = ___', '9 × 5 = ___', '9 + 9 = ___',
'7 × ? = 42', '8 + ? = 13', '2 × 9 = ___', '4 + 8 = ___',
'6 × 6 = ___', '7 + 6 = ___', '8 × 8 = ___', '5 + 7 = ___'
] };
}
}
</script>
</body>
</html>
