<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zigrt, who is learning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#1B2559}a:hover{color:#2F5BEA}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F2F6FF; color: #1B2559; font-family: 'Nunito', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 20px 24px; gap: 24px">
<div aria-label="zigrt" role="img" style="display: flex; align-items: flex-end; justify-content: center; gap: 1px; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 44px; line-height: 1; color: #2F5BEA; height: 64px">
<span style="transform: translateY(0px)">z</span><span style="transform: translateY(-5px)">i</span><span style="transform: translateY(-10px)">g</span><span style="transform: translateY(-15px)">r</span><span style="transform: translateY(-20px); color: #E09A00">t</span>
</div>
<h1 style="margin: 0; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.2">Who's climbing today?</h1>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{kids}}" as="kid" hint-placeholder-count="3">
<a href="S02-Pin.dc.html" style="text-decoration: none; background: #FFFFFF; border-radius: 26px; padding: 22px 12px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 5px 0 #DCE4FA; color: #1B2559">
<span aria-hidden="true" style="width: 84px; height: 84px; border-radius: 999px; background: {{kid.tint}}; color: {{kid.ink}}; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 40px; display: flex; align-items: center; justify-content: center">{{kid.initial}}</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px">{{kid.name}}</span>
<span style="font-size: 14px; font-weight: 700; color: #4A5480">{{kid.where}}</span>
</a>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<a href="P1-SignIn.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; padding: 0 16px; font-weight: 800; font-size: 16px; color: #4A5480">Parent sign-in</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { kids: [
{ name: 'Mika', initial: 'M', where: 'Grade 2', tint: '#FFC533', ink: '#1B2559' },
{ name: 'Theo', initial: 'T', where: 'Grade 4', tint: '#2F5BEA', ink: '#FFFFFF' },
{ name: 'June', initial: 'J', where: 'Kindergarten', tint: '#DCE4FA', ink: '#1B2559' }
] };
}
}
</script>
</body>
</html>
