    strand: decimals
    grade: "4"
    requires: [equivalent-fractions]
    xp: 10
    standards: [4.NF.C.6]
  - {id: make-change, title: Making change, strand: measurement, grade: "4", xp: 12, standards: [4.MD.A.2]}
  - {id: unit-conversion, title: Changing units, strand: measurement, grade: "4", xp: 10, standards: [4.MD.A.1]}
  - id: long-division-2d
    title: Long division by 2 digits
    strand: division
    grade: "5"
    requires: [long-division-1d, mult-2d-2d]
    encompasses: [{topic: long-division-1d, weight: 1.0}, {topic: mult-2d-2d, weight: 0.3}]
    xp: 15
    standards: [5.NBT.B.6]
