    strand: fractions
    grade: "5"
    requires: [mult-fractions]
    xp: 14
    standards: [5.NF.B.7]
  - id: add-decimals
    title: Adding decimals
    strand: decimals
    grade: "5"
    requires: [fraction-to-decimal]
    xp: 10
    standards: [5.NBT.B.7]
  - id: mult-decimals
    title: Multiplying decimals
    strand: decimals
    grade: "5"
    requires: [add-decimals, mult-2d-2d]
    xp: 14
    standards: [5.NBT.B.7]
  - id: volume-prism
    title: Volume of a box
    strand: measurement
    grade: "5"
    requires: [mult-2d-2d]
    xp: 12
    standards: [5.MD.C.5]
  - {id: coordinate-points, title: Points on a grid, strand: geometry, grade: "5", xp: 10, standards: [5.G.A.2]}
