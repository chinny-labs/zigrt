# Teaching order is the order written here.
topics:
  - {id: elapsed-time, title: Elapsed time, strand: measurement, grade: "3", xp: 12, standards: [3.MD.A.1]}
  - {id: round-whole-numbers, title: Rounding whole numbers, strand: place-value, grade: "4", xp: 10, standards: [4.NBT.A.3]}
  - {id: sub-across-zeros, title: Taking away across zeros, strand: add-sub, grade: "4", xp: 12, standards: [4.NBT.B.4]}
  - {id: mult-2d-2d, title: 2-digit by 2-digit multiplying, strand: multiplication, grade: "4", xp: 14, standards: [4.NBT.B.5]}
