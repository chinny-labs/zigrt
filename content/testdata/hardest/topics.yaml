    title: What to do with a remainder
    strand: division
    grade: "4"
    requires: [long-division-1d]
    xp: 12
    standards: [4.OA.A.3]
  - {id: equivalent-fractions, title: Equivalent fractions, strand: fractions, grade: "4", xp: 10, standards: [4.NF.A.1]}
