id: long-division-2d
kps:
  - id: long-division-2d.kp1
    explain: >-
      Round the divisor to the nearest ten to guess each digit. Multiply to
      check the guess. If it is too big, try one less.
    templates:
      - id: long-division-2d.kp1.t1
        vars:
          d: {int: [12, 39]}
          q: {int: [21, 99]}
          r: {int: [0, d - 1]}
          n: q * d + r
        where:
          - d % 10 != 0
        prompt: "{n} ÷ {d}"
        layout: long-division
        parts: [n, d]
        answer: {type: quotient_remainder, value: n // d, remainder: n % d}
        solution:
          - "Tens: how many {d}s in {n // 10}? {q // 10}, because {d} × {q // 10} = {d * (q // 10)}. {n // 10 - d * (q // 10)} is left over."
          - "Ones: bring down {digit(n, 1)} to make {n - 10 * d * (q // 10)}. How many {d}s in that? {q % 10}, because {d} × {q % 10} = {d * (q % 10)}."
          - "{n} ÷ {d} = {q} r {r}"
