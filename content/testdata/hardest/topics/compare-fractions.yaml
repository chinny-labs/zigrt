id: compare-fractions
kps:
  - id: compare-fractions.kp1
    explain: >-
      Give both fractions the same bottom number. Then compare the top
      numbers. The bigger top means the bigger fraction.
    templates:
      - id: compare-fractions.kp1.t1
        vars:
          d1: {int: [2, 12]}
          n1: {int: [1, d1 - 1]}
          d2: {int: [2, 12]}
          n2: {int: [1, d2 - 1]}
          l: lcm(d1, d2)
          a: n1 * l / d1
          b: n2 * l / d2
          sym: "a < b ? '<' : (a > b ? '>' : '=')"
        where:
          - gcd(n1, d1) == 1
          - d1 != d2 && gcd(n2, d2) == 1
          - l <= 60
        prompt: "{n1}/{d1} ○ {n2}/{d2}"
        answer: {type: comparison, compare: ["n1 / d1", "n2 / d2"]}
        solution:
          - "Use {l} as the bottom number for both."
          - when: d1 != l && d2 != l
            text: "{n1}/{d1} = {a}/{l} and {n2}/{d2} = {b}/{l}."
          - when: d1 == l
            text: "{n2}/{d2} = {b}/{l}."
          - when: d2 == l
            text: "{n1}/{d1} = {a}/{l}."
          - "{a} {sym} {b}, so {n1}/{d1} {sym} {n2}/{d2}."
