id: sub-mixed-regroup
kps:
  - id: sub-mixed-regroup.kp1
    explain: >-
      If the first fraction is too small, trade 1 whole for a fraction. One
      whole is 4/4 when you are counting quarters. Then take away.
    templates:
      - id: sub-mixed-regroup.kp1.t1
        vars:
          d: {int: [3, 12]}
          n1: {int: [1, d - 2]}
          n2: {int: [n1 + 1, d - 1]}
          w1: {int: [2, 9]}
          w2: {int: [1, w1 - 1]}
          w: w1 - 1 - w2
          f: d + n1 - n2
        where:
          - gcd(n1, d) == 1 && gcd(n2, d) == 1
        prompt: "{w1} {n1}/{d} − {w2} {n2}/{d}"
        answer: {type: fraction, value: w1 + n1 / d - w2 - n2 / d, simplest: false}
        solution:
          - "{n1}/{d} is less than {n2}/{d}, so trade 1 whole for {d}/{d}."
          - "{w1} {n1}/{d} = {w1 - 1} {d + n1}/{d}."
          - "{d + n1}/{d} − {n2}/{d} = {f}/{d}, and {w1 - 1} − {w2} = {w}."
          - "The answer is {w == 0 ? '' : join(w, ' ')}{f}/{d}."
