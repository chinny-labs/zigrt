id: coordinate-points
kps:
  - id: coordinate-points.kp1
    explain: >-
      Start at zero. Go across first, then up. Write the across number first
      and the up number second.
    templates:
      - id: coordinate-points.kp1.t1
        vars:
          x: {int: [1, 9]}
          y: {int: [1, 9]}
        where:
          - x != y
        prompt: "Which pair names the point?"
        layout: figure
        figure: coordinate
        figure_args: {size: "10", x: x, y: y}
        answer:
          type: choice
          right: "({x}, {y})"
          distractors:
            - "({y}, {x})"        # up first, then across
            - "({x + 1}, {y})"    # counted the lines from 1
            - "({x}, {y + 1})"
        solution:
          - "Start at 0. Go across to {x}, then up to {y}."
          - "The point is ({x}, {y})."
