{{define "main"}}
<div class="column">
  <h1>Add a parent</h1>
  {{template "flash" .}}
  <form method="post" action="/parent/parents" class="card stack" autocomplete="off">
    {{template "csrf" .}}
    <div class="field"><label for="display_name">Name</label><input id="display_name" name="display_name" value="{{.Val "display_name"}}" maxlength="40" required></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{.Val "email"}}" required></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" minlength="12" required autocomplete="new-password"><span class="hint">At least 12 characters. They can change it after signing in.</span></div>
    <button class="btn btn-primary" type="submit">Add parent</button>
  </form>
</div>
{{end}}
